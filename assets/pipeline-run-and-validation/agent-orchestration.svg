<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600" role="img" aria-labelledby="title desc">
  <title id="title">Agent orchestration and chat architecture</title>
  <desc id="desc">SQLite inference results enter a LangGraph meta-agent flow that coordinates policy, analysis, and evidence agents. Generated artifacts and database records support chat, SQL queries, and ticketing.</desc>
  <defs>
    <style>
      .group { fill: none; stroke: #6b7280; stroke-width: 2.5; stroke-dasharray: 9 7; }
      .phase { fill: #4b5563; stroke: #374151; stroke-width: 2.5; }
      .phaseText { font: 700 18px Arial, sans-serif; fill: #fff; }
      .meta { fill: #d1d5db; stroke: #4b5563; stroke-width: 2.5; }
      .agent { fill: #e5e7eb; stroke: #4b5563; stroke-width: 2.5; }
      .external { fill: #f3f4f6; stroke: #4b5563; stroke-width: 2.5; }
      .label { font: 700 17px Arial, sans-serif; fill: #111; }
      .detail { font: 14px Arial, sans-serif; fill: #333; }
      .arrow { fill: none; stroke: #6b7280; stroke-width: 2.5; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="35" y="210" width="170" height="120" rx="8" class="external"/>
  <text x="120" y="255" text-anchor="middle" class="label">Detection DB</text>
  <text x="120" y="285" text-anchor="middle" class="detail">SQLite results</text>

  <rect x="250" y="45" width="785" height="455" rx="18" class="group"/>
  <rect x="540" y="28" width="205" height="54" rx="8" class="phase"/>
  <text x="642" y="62" text-anchor="middle" class="phaseText">LangGraph Orchestration</text>

  <rect x="285" y="110" width="190" height="90" rx="8" class="meta"/>
  <text x="380" y="148" text-anchor="middle" class="label">Entry</text>
  <text x="380" y="176" text-anchor="middle" class="detail">Meta node</text>

  <rect x="540" y="110" width="190" height="90" rx="8" class="meta"/>
  <text x="635" y="148" text-anchor="middle" class="label">Collect Policy</text>
  <text x="635" y="176" text-anchor="middle" class="detail">Meta node</text>

  <rect x="795" y="110" width="200" height="90" rx="8" class="meta"/>
  <text x="895" y="148" text-anchor="middle" class="label">Collect Results</text>
  <text x="895" y="176" text-anchor="middle" class="detail">Meta node</text>

  <rect x="285" y="330" width="190" height="100" rx="8" class="agent"/>
  <text x="380" y="370" text-anchor="middle" class="label">Policy Agent</text>
  <text x="380" y="398" text-anchor="middle" class="detail">Threshold policy</text>

  <rect x="540" y="330" width="190" height="100" rx="8" class="agent"/>
  <text x="635" y="370" text-anchor="middle" class="label">Analysis Agent</text>
  <text x="635" y="398" text-anchor="middle" class="detail">Result summary</text>

  <rect x="795" y="330" width="200" height="100" rx="8" class="agent"/>
  <text x="895" y="370" text-anchor="middle" class="label">Evidence Agent</text>
  <text x="895" y="398" text-anchor="middle" class="detail">Audit trail</text>

  <path d="M205 270 H245 V155 H280" class="arrow"/>
  <path d="M380 200 V325" class="arrow"/>
  <path d="M475 380 H505 V155 H535" class="arrow"/>
  <path d="M635 200 V325" class="arrow"/>
  <path d="M730 380 H790" class="arrow"/>
  <path d="M895 330 V205" class="arrow"/>

  <rect x="1080" y="95" width="275" height="150" rx="8" class="external"/>
  <text x="1217" y="132" text-anchor="middle" class="label">Agent Artifacts</text>
  <text x="1217" y="163" text-anchor="middle" class="detail">Policy JSON</text>
  <text x="1217" y="190" text-anchor="middle" class="detail">Analysis summary</text>
  <text x="1217" y="217" text-anchor="middle" class="detail">Evidence trail</text>
  <path d="M995 155 H1075" class="arrow"/>

  <rect x="1080" y="330" width="275" height="150" rx="8" class="external"/>
  <text x="1217" y="367" text-anchor="middle" class="label">Chat and Tickets</text>
  <text x="1217" y="398" text-anchor="middle" class="detail">Analysis QA · Evidence QA</text>
  <text x="1217" y="425" text-anchor="middle" class="detail">SQL QA · Ticketing</text>
  <text x="1217" y="452" text-anchor="middle" class="detail">Phi-4 + SQLCoder</text>
  <path d="M1217 245 V325" class="arrow"/>

  <path d="M120 330 V550 H1217 V485" class="arrow"/>
</svg>
