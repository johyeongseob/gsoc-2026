<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#222"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:42px;font-weight:700}.sub{font-size:20px;fill:#444}
      .head{font-size:21px;font-weight:700}.body{font-size:17px;fill:#444}.box{fill:#fff;stroke:#333;stroke-width:1.5}
      .group{fill:#fff;stroke:#222;stroke-width:1.7}.band{fill:#eee;stroke:#222;stroke-width:1.5}.line{stroke:#222;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="760" fill="#fff"/>
  <text x="800" y="66" text-anchor="middle" class="title">Solar Panel Defects: Detection Inference</text>
  <text x="800" y="101" text-anchor="middle" class="sub">Electroluminescence images are converted into localized defect evidence</text>
  <rect x="70" y="165" width="1460" height="430" class="group"/>
  <rect x="70" y="165" width="1460" height="55" class="band"/>
  <text x="800" y="201" text-anchor="middle" class="head">OpenVINO Image Detection Pipeline</text>
  <rect x="115" y="300" width="230" height="125" class="box"/>
  <text x="230" y="345" text-anchor="middle" class="head">EL Image</text>
  <text x="230" y="378" text-anchor="middle" class="body">single-channel cell</text>
  <text x="230" y="405" text-anchor="middle" class="body">defect texture</text>
  <path d="M345 362 H425" class="line"/>
  <rect x="425" y="300" width="230" height="125" class="box"/>
  <text x="540" y="345" text-anchor="middle" class="head">Preprocessing</text>
  <text x="540" y="378" text-anchor="middle" class="body">resize · normalize</text>
  <text x="540" y="405" text-anchor="middle" class="body">model input tensor</text>
  <path d="M655 362 H735" class="line"/>
  <rect x="735" y="300" width="230" height="125" class="box"/>
  <text x="850" y="345" text-anchor="middle" class="head">YOLO Detector</text>
  <text x="850" y="378" text-anchor="middle" class="body">OpenVINO inference</text>
  <text x="850" y="405" text-anchor="middle" class="body">candidate detections</text>
  <path d="M965 362 H1045" class="line"/>
  <rect x="1045" y="300" width="230" height="125" class="box"/>
  <text x="1160" y="345" text-anchor="middle" class="head">Postprocessing</text>
  <text x="1160" y="378" text-anchor="middle" class="body">confidence policy</text>
  <text x="1160" y="405" text-anchor="middle" class="body">class + bounding box</text>
  <path d="M1275 362 H1355" class="line"/>
  <rect x="1355" y="300" width="135" height="125" class="band"/>
  <text x="1422" y="345" text-anchor="middle" class="head">Evidence</text>
  <text x="1422" y="378" text-anchor="middle" class="body">annotation</text>
  <text x="1422" y="405" text-anchor="middle" class="body">JSONL · SQL</text>
  <rect x="405" y="640" width="790" height="58" class="band"/>
  <text x="800" y="677" text-anchor="middle" class="head">Each prediction preserves its location, class, and confidence</text>
</svg>
