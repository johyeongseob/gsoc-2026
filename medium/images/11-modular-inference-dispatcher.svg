<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc">
  <title id="title">From monolithic inference to a modular dispatcher architecture</title>
  <desc id="desc">The original inference entry point combined configuration, model logic, execution, and outputs. The refactored architecture separates configuration, runner, dispatcher, modality handlers, and shared output services.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#222"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:42px;font-weight:700}.sub{font-size:20px;fill:#444}
      .section{font-size:23px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:16px;fill:#444}.code{font:700 18px Consolas,monospace;fill:#111}
      .box{fill:#fff;stroke:#333;stroke-width:1.5}.band{fill:#eee;stroke:#222;stroke-width:1.5}.dash{fill:#fff;stroke:#777;stroke-width:1.5;stroke-dasharray:7 6}
      .line{stroke:#222;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.muted{stroke:#777;stroke-width:1.4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="800" fill="#fff"/>
  <text x="800" y="64" text-anchor="middle" class="title">From Monolithic Inference to Modular Dispatch</text>
  <text x="800" y="99" text-anchor="middle" class="sub">Separating responsibilities made heterogeneous use cases extensible through one entry point</text>

  <rect x="65" y="155" width="470" height="500" class="box"/>
  <rect x="65" y="155" width="470" height="58" class="band"/>
  <text x="300" y="193" text-anchor="middle" class="section">Before: coupled execution</text>
  <rect x="115" y="275" width="115" height="78" class="box"/>
  <text x="172" y="308" text-anchor="middle" class="head">Input</text>
  <text x="172" y="335" text-anchor="middle" class="body">data · options</text>
  <path d="M230 314 H275" class="line"/>
  <rect x="275" y="245" width="210" height="138" class="band"/>
  <text x="380" y="287" text-anchor="middle" class="code">run_inference_oep.py</text>
  <text x="380" y="321" text-anchor="middle" class="body">configuration · routing</text>
  <text x="380" y="348" text-anchor="middle" class="body">model logic · writing · viz</text>
  <path d="M380 383 V443" class="line"/>
  <rect x="275" y="443" width="210" height="88" class="box"/>
  <text x="380" y="480" text-anchor="middle" class="head">Outputs</text>
  <text x="380" y="509" text-anchor="middle" class="body">JSONL · SQLite · images</text>
  <text x="300" y="595" text-anchor="middle" class="body">New modality = changes to the central flow</text>

  <path d="M570 405 H650" class="line"/>
  <text x="610" y="382" text-anchor="middle" class="head">Refactor</text>

  <rect x="680" y="155" width="855" height="500" class="box"/>
  <rect x="680" y="155" width="855" height="58" class="band"/>
  <text x="1107" y="193" text-anchor="middle" class="section">After: configurable modular architecture</text>
  <rect x="700" y="285" width="190" height="95" class="box"/>
  <text x="795" y="324" text-anchor="middle" class="head">Use-case Config</text>
  <text x="795" y="353" text-anchor="middle" class="body">model · mode</text>
  <path d="M890 332 H920" class="line"/>
  <rect x="920" y="285" width="135" height="95" class="box"/>
  <text x="987" y="324" text-anchor="middle" class="head">Runner</text>
  <text x="987" y="353" text-anchor="middle" class="body">shared lifecycle</text>
  <path d="M1055 332 H1100" class="line"/>
  <polygon points="1180,267 1260,332 1180,397 1100,332" class="band"/>
  <text x="1180" y="326" text-anchor="middle" class="head">Dispatcher</text>
  <text x="1180" y="354" text-anchor="middle" class="body">select handler</text>
  <path d="M1260 332 H1288" class="line"/>
  <rect x="1300" y="242" width="200" height="180" class="dash"/>
  <text x="1400" y="274" text-anchor="middle" class="head">Focused Handlers</text>
  <rect x="1315" y="292" width="170" height="34" class="box"/><text x="1400" y="315" text-anchor="middle" class="body">Image</text>
  <rect x="1315" y="335" width="170" height="34" class="box"/><text x="1400" y="358" text-anchor="middle" class="body">Sensor</text>
  <rect x="1315" y="378" width="170" height="34" class="box"/><text x="1400" y="401" text-anchor="middle" class="body">Multimodal</text>

  <path d="M987 380 V475" class="muted"/>
  <path d="M1180 397 V475" class="muted"/>
  <path d="M1400 422 V475" class="muted"/>
  <rect x="760" y="475" width="690" height="95" class="band"/>
  <text x="1105" y="514" text-anchor="middle" class="head">Shared Services</text>
  <text x="1105" y="546" text-anchor="middle" class="body">output writers · visualization · JSONL · SQLite · evidence</text>
  <text x="1107" y="614" text-anchor="middle" class="body">New modality = add a focused handler and configuration</text>

  <rect x="400" y="704" width="800" height="56" class="band"/>
  <text x="800" y="740" text-anchor="middle" class="head">Stable shared components; isolated modality-specific behavior</text>
</svg>
