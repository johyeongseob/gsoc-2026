<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="8" refX="11.5" refY="4" orient="auto"><path d="M0,0 L12,4 L0,8 Z" fill="#222"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#111}.title{font-size:42px;font-weight:700}.sub{font-size:20px;fill:#444}
      .head{font-size:21px;font-weight:700}.body{font-size:17px;fill:#444}.box{fill:#fff;stroke:#333;stroke-width:1.5}
      .group{fill:#fff;stroke:#222;stroke-width:1.7}.band{fill:#eee;stroke:#222;stroke-width:1.5}.line{stroke:#222;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.join{stroke:#222;stroke-width:1.7;fill:none}
    </style>
  </defs>
  <rect width="1600" height="760" fill="#fff"/>
  <text x="800" y="66" text-anchor="middle" class="title">Power Transmission: Classification Inference</text>
  <text x="800" y="101" text-anchor="middle" class="sub">One classifier processes both synthetic and real-world inspection imagery</text>
  <rect x="70" y="165" width="1460" height="430" class="group"/>
  <rect x="70" y="165" width="1460" height="55" class="band"/>
  <text x="800" y="201" text-anchor="middle" class="head">OpenVINO Image Classification Pipeline</text>
  <rect x="105" y="270" width="230" height="90" class="box"/>
  <text x="220" y="308" text-anchor="middle" class="head">Synthetic Image</text>
  <text x="220" y="338" text-anchor="middle" class="body">rendered circuit view</text>
  <rect x="105" y="390" width="230" height="90" class="box"/>
  <text x="220" y="428" text-anchor="middle" class="head">Real Image</text>
  <text x="220" y="458" text-anchor="middle" class="body">field inspection view</text>
  <path d="M335 315 H355 V362 M335 435 H355 V362" class="join"/>
  <path d="M355 362 H394" class="line"/>
  <rect x="400" y="300" width="230" height="125" class="box"/>
  <text x="515" y="345" text-anchor="middle" class="head">Preprocessing</text>
  <text x="515" y="378" text-anchor="middle" class="body">resize · normalize</text>
  <text x="515" y="405" text-anchor="middle" class="body">image tensor</text>
  <path d="M630 362 H720" class="line"/>
  <rect x="720" y="300" width="250" height="125" class="box"/>
  <text x="845" y="345" text-anchor="middle" class="head">YOLOv8s-cls</text>
  <text x="845" y="378" text-anchor="middle" class="body">OpenVINO inference</text>
  <text x="845" y="405" text-anchor="middle" class="body">three class scores</text>
  <path d="M970 362 H1060" class="line"/>
  <rect x="1060" y="300" width="230" height="125" class="box"/>
  <text x="1175" y="345" text-anchor="middle" class="head">Classification</text>
  <text x="1175" y="378" text-anchor="middle" class="body">highest-score class</text>
  <text x="1175" y="405" text-anchor="middle" class="body">confidence retained</text>
  <path d="M1290 362 H1370" class="line"/>
  <rect x="1370" y="300" width="125" height="125" class="band"/>
  <text x="1432" y="345" text-anchor="middle" class="head">Evidence</text>
  <text x="1432" y="378" text-anchor="middle" class="body">preview</text>
  <text x="1432" y="405" text-anchor="middle" class="body">class score</text>
  <rect x="380" y="640" width="840" height="58" class="band"/>
  <text x="800" y="677" text-anchor="middle" class="head">The same serving path supports both dataset domains</text>
